{% extends "base.html" %}

{% block content %}
<div class="panel animate-fade-up" style="max-width: 600px; margin: 2rem auto; padding: 2.5rem; position: relative;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i data-lucide="key-round" style="width: 48px; height: 48px; color: var(--accent-primary); margin-bottom: 0.75rem;"></i>
        <h2 class="panel-title" style="font-size: 1.5rem; font-weight: 700; display: block;">Update Account Password</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">For security, keep your portal access password updated</p>
    </div>
    
    <form action="{{ url_for('auth.change_password') }}" method="POST">
        <div class="form-group">
            <label for="current_password" class="form-label">Current Password</label>
            <input type="password" id="current_password" name="current_password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required minlength="6">
            <small style="color: var(--text-secondary); font-size: 0.75rem; display: block; margin-top: 0.25rem;">Must be at least 6 characters long</small>
        </div>
        
        <div class="form-group" style="margin-bottom: 2.5rem;">
            <label for="confirm_password" class="form-label">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="javascript:history.back()" class="btn btn-secondary">
                <span>Cancel</span>
            </a>
            <button type="submit" class="btn btn-primary">
                <i data-lucide="shield-check"></i>
                <span>Save Password</span>
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
