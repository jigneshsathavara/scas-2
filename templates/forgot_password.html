<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart College Analytics System</title>
    <script>
        // Set theme immediately to prevent white flash
        (function() {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
        })();
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-illustration {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body class="login-container">
    <div class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast-alert {{ category }}">
                        <i data-lucide="{% if category == 'success' %}check-circle{% elif category == 'danger' %}alert-circle{% else %}info{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-illustration">
                <i data-lucide="help-circle" style="width:64px; height:64px;"></i>
            </div>
            <h2>Reset Password</h2>
            <p>Enter your email to receive a temporary password</p>
        </div>
        
        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your registered email" required autocomplete="email">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem; margin-bottom: 1rem;">
                <span>Send Reset Request</span>
                <i data-lucide="mail"></i>
            </button>
            
            <div style="text-align: center;">
                <a href="{{ url_for('auth.login') }}" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    <span>Back to Portal Login</span>
                </a>
            </div>
        </form>
    </div>

    <script>
        // Init Lucide
        lucide.createIcons();
        
        // Auto-dismiss flashes
        const toasts = document.querySelectorAll('.toast-alert');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        });
    </script>
</body>
</html>
