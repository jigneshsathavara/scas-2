<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart College Analytics System</title>
    <script>
        // Set theme immediately to prevent white flash
        (function() {
            let currentTheme = localStorage.getItem('theme');
            if (!currentTheme) {
                currentTheme = 'dark';
                localStorage.setItem('theme', 'dark');
            }
            document.documentElement.setAttribute('data-theme', currentTheme);
        })();
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-illustration {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .demo-credentials {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .demo-credentials p {
            margin-bottom: 0.25rem;
        }
        .demo-credentials strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body class="login-container">
    <canvas id="ambient-canvas"></canvas>
    <div class="glow-blobs">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
        <div class="glow-blob glow-blob-3"></div>
    </div>
    <div class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast-alert {{ category }}">
                        <i data-lucide="{% if category == 'success' %}check-circle{% elif category == 'danger' %}alert-circle{% else %}info{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-illustration">
                <i data-lucide="graduation-cap" style="width:64px; height:64px;"></i>
            </div>
            <h2>Portal Sign In</h2>
            <p>Smart College AI & Data Analytics Portal</p>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter portal username or email" required autocomplete="username">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; color: var(--accent-secondary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem;">
                <span>Authenticate Credentials</span>
                <i data-lucide="arrow-right"></i>
            </button>
        </form>
        
        <div class="demo-credentials" style="margin-top: 1.5rem; padding: 1.25rem; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px;">
            <p style="font-weight: 600; margin-bottom: 0.75rem; color: var(--accent-secondary); font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;">
                <i data-lucide="key-round" style="width: 14px; height: 14px;"></i>
                <span>Quick Access Accounts:</span>
            </p>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem;">
                    <span>🔑 <strong>Admin:</strong> admin</span>
                    <button type="button" onclick="quickLogin('admin', 'admin123')" class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 6px; border: 1px solid var(--accent-primary); color: #fff; background: rgba(139, 92, 246, 0.15); cursor: pointer;">
                        Quick Login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init Lucide
        lucide.createIcons();
        
        // Quick access helper
        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.querySelector('form').submit();
        }
        
        // Auto-dismiss flashes
        const toasts = document.querySelectorAll('.toast-alert');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
