<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Smart College Analytics System</title>
    <script>
        // Set theme immediately to prevent white flash
        (function() {
            let currentTheme = localStorage.getItem('theme');
            if (!currentTheme) {
                currentTheme = 'dark';
                localStorage.setItem('theme', 'dark');
            }
            document.documentElement.setAttribute('data-theme', currentTheme);
        })();
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-illustration {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body class="login-container">
    <canvas id="ambient-canvas"></canvas>
    <div class="glow-blobs">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
        <div class="glow-blob glow-blob-3"></div>
    </div>
    <div class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast-alert {{ category }}">
                        <i data-lucide="{% if category == 'success' %}check-circle{% elif category == 'danger' %}alert-circle{% else %}info{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-illustration">
                <i data-lucide="key-round" style="width:64px; height:64px;"></i>
            </div>
            <h2>Reset Password</h2>
            <p>Enter your new password below</p>
        </div>
        
        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                <small style="color: var(--text-secondary); font-size: 0.75rem; display: block; margin-top: 0.25rem;">Must be at least 6 characters long</small>
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem; margin-bottom: 1rem;">
                <span>Update Password</span>
                <i data-lucide="shield-check"></i>
            </button>
            
            <div style="text-align: center;">
                <a href="{{ url_for('auth.login') }}" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    <span>Back to Portal Login</span>
                </a>
            </div>
        </form>
    </div>

    <script>
        // Init Lucide
        lucide.createIcons();
        
        // Auto-dismiss flashes
        const toasts = document.querySelectorAll('.toast-alert');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
